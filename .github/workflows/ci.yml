name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install adapter test dependencies
        run: python -m pip install -r requirements-adapter.txt
      - name: Check syntax
        run: python -m compileall -q smoke.py build_shell.py verify_shell.py test_smoke.py test_adapter.py test_shell_boundary.py adapter
      - name: Run offline tests
        run: python -m unittest -v test_smoke test_adapter test_shell_boundary
      - name: Check command help
        run: python smoke.py --help
      - name: Check adapter mode help
        run: python -m adapter.validate --help
