name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14'
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install adapter test dependencies
        run: python -m pip install -r requirements-adapter.txt
      - name: Install browser for offline feature tests
        run: python -m playwright install --with-deps chromium
      - name: Check syntax
        run: python -m compileall -q smoke.py build_shell.py verify_shell.py test_smoke.py test_adapter.py test_shell_boundary.py test_evaluator.py baseline_regressions.py test_learning.py test_brightness.py test_live_results.py test_portable_ui.py verify_portable_source.py verify_adjustments.py evaluator adapter learning features
      - name: Run offline tests
        run: python -m unittest -v test_smoke test_adapter test_shell_boundary test_evaluator test_learning test_brightness test_features test_interaction_map test_harness_repair test_fresh_brightness test_live_sessions test_live_results test_presentation_atomic test_adjustment_contract
      - name: Verify relocatable CI fixtures
        run: python -m learning.ci_fixtures --check
      - name: Check command help
        run: python smoke.py --help
      - name: Check adapter mode help
        run: python -m adapter.validate --help
      - name: Check evaluator help
        run: python -m evaluator.compare --help

      - name: Check bounded learning help
        run: python -m learning.run --help

      - name: Check brightness learning help
        run: python -m learning.brightness --help

  dashboard-checks:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dashboard
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm ci
      - name: Run dashboard tests
        run: npm test
      - name: Type check and build dashboard
        run: npm run build

      - name: Set up Python for offline dashboard browser tests
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install dashboard browser test dependencies
        run: |
          python -m pip install -r ../requirements-adapter.txt
          python -m playwright install --with-deps chromium
      - name: Verify integrated replay entry point and offline recordings
        working-directory: .
        run: python -m unittest -v test_feature_ui test_live_ui test_portable_ui
